<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContactHub</title>
    <link
      href="
        https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css
"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-sm bg-body-tertiary">
      <div class="container-fluid container-lg px-4">
        <div class="d-flex align-items-center gap-3">
          <span class="brand-icon">
            <i class="fa-solid fa-address-book"></i>
          </span>
          <span>
            <a class="navbar-brand m-0 p-0 fw-bold fs-4" href="#"
              >Contact<span style="color: #7f22fe">Hub</span></a
            >
            <p class="navbar-text m-0 p-0 fw-bold">Smart Contact Manager</p>
          </span>
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse d-flex gap-4" id="navbarNav">
          <ul class="navbar-nav ms-auto d-flex align-items-center gap-4">
            <li class="nav-item">
              <button
                class="btn fw-bold px-4 py-2 button-nav text-white rounded-4 d-flex align-items-center gap-2"
                data-bs-toggle="modal"
                data-bs-target="#addContactModal"
              >
                <i class="fa-solid fa-plus"></i>
                Add Content
              </button>
            </li>
            <li class="nav-item text-muted fs-5 button-icon">
              <i class="fa-solid fa-bell"></i>
            </li>
            <li class="nav-item text-muted fs-5 button-icon">
              <i class="fa-solid fa-gear"></i>
            </li>
          </ul>
          <div class="d-flex align-items-center img-icon">
            <img src="./assets/avatar-4.jpg" alt="avatar" class="w-100" />
          </div>
        </div>
      </div>
    </nav>

    <main class="container-lg py-4">
      <!-- stats -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="stat-card d-flex align-items-center gap-3">
            <span class="icon-box bg-gradient-blue">
              <i class="fa-solid fa-users"></i>
            </span>
            <div>
              <p class="stat-label m-0">Total</p>
              <h3 class="fw-bold m-0" id="totalCount">0</h3>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card d-flex align-items-center gap-3">
            <span class="icon-box bg-gradient-orange">
              <i class="fa-solid fa-star"></i>
            </span>
            <div>
              <p class="stat-label m-0">Favorites</p>
              <h3 class="fw-bold m-0" id="favoritesCount">0</h3>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card d-flex align-items-center gap-3">
            <span class="icon-box bg-gradient-red">
              <i class="fa-solid fa-heart-pulse"></i>
            </span>
            <div>
              <p class="stat-label m-0">Emergency</p>
              <h3 class="fw-bold m-0" id="emergencyCount">0</h3>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <!-- all contacts -->
        <div class="col-lg-8">
          <h2 class="fw-bold mb-1">All Contacts</h2>
          <p class="text-secondary mb-4">
            Manage and organize your <span id="contactsCount">0</span> contacts
          </p>
          <!-- search -->
          <div class="search-box mb-5">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              oninput="searchContacts()"
              type="search"
              class="form-control"
              id="searchInput"
              placeholder="Search by name, phone, or email..."
            />
          </div>
          <!--  cards -->
          <div class="row g-4" id="contactsList"></div>
          <!-- empty state -->
          <div class="text-center py-5" id="emptyContacts">
            <span class="empty-icon mx-auto mb-3">
              <i class="fa-solid fa-address-book"></i>
            </span>
            <p class="fw-semibold text-secondary mb-1">No contacts found</p>
            <p class="small text-secondary">
              Click "Add Contact" to get started
            </p>
          </div>
        </div>

        <!-- sidebar -->
        <div class="col-lg-4 d-flex flex-column gap-4">
          <div class="side-card">
            <div
              class="side-card-header bg-favorites d-flex align-items-center gap-3"
            >
              <span class="icon-box icon-sm bg-gradient-orange">
                <i class="fa-solid fa-star"></i>
              </span>
              <div>
                <h5 class="fw-bold m-0">Favorites</h5>
                <p class="small text-secondary m-0">
                  Quick access to starred contacts
                </p>
              </div>
            </div>
            <div class="side-card-body" id="favoritesList"></div>
          </div>

          <div class="side-card">
            <div
              class="side-card-header bg-emergency d-flex align-items-center gap-3"
            >
              <span class="icon-box icon-sm bg-gradient-red">
                <i class="fa-solid fa-heart-pulse"></i>
              </span>
              <div>
                <h5 class="fw-bold m-0">Emergency</h5>
                <p class="small text-secondary m-0">
                  Important contacts for urgent calls
                </p>
              </div>
            </div>
            <div class="side-card-body" id="emergencyList"></div>
          </div>
        </div>
      </div>
    </main>
    <!-- modal -->
    <div
      class="modal fade"
      id="addContactModal"
      data-bs-keyboard="false"
      data-bs-backdrop="static"
    >
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-4 fw-bold" id="staticBackdropLabel">
              Add New Contact
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <!-- imgbutton -->
            <div class="d-flex flex-column align-items-center gap-3">
              <span class="modal-icon" id="modalPreview">
                <i class="fa-solid fa-user"></i>
              </span>
              <input
                class="visually-hidden file-input"
                type="file"
                id="contactImage"
                accept="image/*"
                onchange="previewImage()"
              />
              <label
                for="contactImage"
                class="btn fw-bold px-4 py-2 rounded-3 d-flex align-items-center gap-2"
              >
                <i class="fa-solid fa-camera"></i>
                Change Photo
              </label>
            </div>
            <div class="d-flex flex-column gap-3 mt-4">
              <div>
                <label for="contactName" class="form-label"
                  >Full Name <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  id="contactName"
                  placeholder="Enter full name"
                />
              </div>
              <div>
                <label for="contactPhone" class="form-label"
                  >Phone Number <span class="text-danger">*</span></label
                >
                <input
                  type="tel"
                  class="form-control"
                  id="contactPhone"
                  placeholder="e.g., 01012345678"
                />
              </div>
              <div>
                <label for="contactEmail" class="form-label"
                  >Email Address</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="contactEmail"
                  placeholder="name@example.com"
                />
              </div>
              <div>
                <label for="contactAddress" class="form-label">Address</label>
                <input
                  type="text"
                  class="form-control"
                  id="contactAddress"
                  placeholder="Enter address"
                />
              </div>

              <div>
                <label for="contactGroup" class="form-label">Group</label>
                <select class="form-select" id="contactGroup">
                  <option value="" selected>Select a Group</option>
                  <option value="family">Family</option>
                  <option value="friends">Friends</option>
                  <option value="work">Work</option>
                  <option value="school">School</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <div>
                <label for="contactNotes" class="form-label">Notes</label>
                <textarea
                  class="form-control"
                  id="contactNotes"
                  rows="3"
                  placeholder="Add notes about this contact"
                ></textarea>
              </div>

              <div class="d-flex gap-4 mt-2">
                <div class="form-check d-flex align-items-center gap-2">
                  <input
                    class="form-check-input m-0"
                    type="checkbox"
                    id="contactFavorite"
                  />
                  <label class="form-check-label" for="contactFavorite">
                    <i class="fa-solid fa-star" style="color: #fbbf24"></i>
                    Favorite
                  </label>
                </div>
                <div class="form-check d-flex align-items-center gap-2">
                  <input
                    class="form-check-input m-0"
                    type="checkbox"
                    id="contactEmergency"
                  />
                  <label class="form-check-label" for="contactEmergency">
                    <i
                      class="fa-solid fa-heart-pulse"
                      style="color: #f43f5e"
                    ></i>
                    Emergency
                  </label>
                </div>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <div class="d-flex w-100 gap-3 m-0">
              <button
                type="button"
                class="btn btn-cancel fw-bold flex-fill py-2 rounded-3"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button
                id="saveButton"
                onclick="addContact()"
                type="button"
                class="btn button-nav text-white fw-bold flex-fill py-2 rounded-3 d-flex align-items-center justify-content-center gap-2"
              >
                <i class="fa-solid fa-check"></i>
                Save Contact
              </button>
              <button
                id="updateButton"
                onclick="updateContacts()"
                type="button"
                class="btn d-none button-nav text-white fw-bold flex-fill py-2 rounded-3 d-flex align-items-center justify-content-center gap-2"
              >
                <i class="fa-solid fa-check"></i>
                Update Contact
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="
    https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js
"></script>
    <script src="./Js/main.js"></script>
  </body>
</html>
